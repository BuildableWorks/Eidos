# Backlog (backlog) settings shared by everyone in this project. Edit here, or on the Plugins page.
statuses:
  - Backlog
  - To Do
  - In Progress
  - In Review
  - Done
columns:
  - name: To Do
    statuses:
      - To Do
  - name: In Progress
    statuses:
      - In Progress
  - name: In Review
    statuses:
      - In Review
  - name: Done
    statuses:
      - Done
default_status: Backlog
status_colors: {}
status_categories:
  Backlog: todo
  To Do: todo
  In Progress: in_progress
  In Review: in_progress
  Done: done
priorities:
  - High
  - Medium
  - Low
priority_icons: {}
priority_colors: {}
column_cards: 7
forms_section: true
milestones: []
properties: []
builtin_properties: []
sections:
  - title: Description
    type: text
    meaning: what the work is and why, read first
  - title: Acceptance Criteria
    type: checklist
    meaning: what must be true when it is done, one line each, ticked as each is met
  - title: Implementation Notes
    type: text
    meaning: "what the work turned up that a later reader should know: a constraint
      met, a call made inside the agreed scope"
types:
  - name: default
    title: Task
    icon: circle
    color: gray
  - name: story
    title: Story
    icon: bookmark
    color: green
    sections:
      - title: Description
        type: text
        meaning: what the work is and why, read first
      - title: Acceptance Criteria
        type: checklist
        meaning: what must be true when it is done, one line each, ticked as each is met
      - title: Implementation Notes
        type: text
        meaning: "what the work turned up that a later reader should know: a constraint
          met, a call made inside the agreed scope"
  - name: bug
    title: Bug
    icon: bug
    color: red
    sections:
      - title: Description
        type: text
        meaning: what the work is and why, read first
      - title: How to Replicate
        type: text
        meaning: the steps that make it happen again
      - title: Expected Result
        type: text
        meaning: what should have happened instead
      - title: Implementation Notes
        type: text
        meaning: "what the work turned up that a later reader should know: a constraint
          met, a call made inside the agreed scope"
  - name: incident
    title: Incident
    icon: alert
    color: red
    sections:
      - title: What Happened
        type: text
        meaning: what went wrong, and when
      - title: Impact
        type: text
        meaning: who and what it affected
      - title: Resolution
        type: text
        meaning: how it was fixed, and what stops it happening again
link_types:
  - name: blocks
    outward: blocks
    inward: is blocked by
  - name: relates
    outward: relates to
    inward: relates to
  - name: duplicates
    outward: duplicates
    inward: is duplicated by
  - name: clones
    outward: clones
    inward: is cloned by
boards: []
sprints: false
setup_offered: false
milestone_properties: []
