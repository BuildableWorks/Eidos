# The rules EIDOS.md 5.12.0 sets for a framework document, `.eidos/Framework.yaml`, as a JSON Schema
# (draft 2020-12) written in YAML. It is a rule set applied to the parsed YAML: the framework stays
# YAML. Each part says the EIDOS.md section it comes from. Where EIDOS.md leaves a thing open (a
# tool's keys on an entry, the generated index), the schema allows it rather than forbids it.
# Checked by `npm run check:frameworks`; frozen per release beside the standard in versions/.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/BuildableWorks/Eidos/schema/framework.schema.yaml
title: Eidos framework document (Framework.yaml), standard 5.12.0
description: >-
  EIDOS.md, `Framework.yaml`: "One per project, `Framework.yaml` or `.yml`, snake_case, comments
  welcome. Every path is relative to `.eidos/`." The keys are the ones its sample names.
type: object
required: [eidos_version]
additionalProperties: false
properties:
  eidos_version:
    description: >-
      Rule 15: "The Eidos version is a framework fact, in `eidos_version`, never on a blueprint."
      Versioning: "Semantic Versioning."
    type: string
    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$'
    x-says: is not a version (MAJOR.MINOR.PATCH)
  naming:
    description: >-
      Naming: "Everything a human reads in the tree follows `naming`. Absent means `kebab-case`."
      The three conventions are kebab-case, TitleCase, and Title Case.
    enum: [kebab-case, TitleCase, Title Case]
  top_level:
    description: '`top_level`: "every file at the top of the project, each a `title`, `path`, and `description`."'
    type: array
    items: { $ref: '#/$defs/topLevelDoc' }
  folders:
    description: >-
      `folders`: "every folder at the top of the project, each a `name` and `description`, and
      `owned_by` when something owns it."
    type: array
    items: { $ref: '#/$defs/folder' }
  properties:
    description: >-
      `properties`: "one block per owner. `core` holds the standard properties, rewritten by a
      migration. `custom` is the owner's. `tools.<tool>` is that tool's alone."
    type: object
    additionalProperties: false
    properties:
      core:
        description: 'The sample: "the standard''s; empty = the standard properties for this eidos_version".'
        type: array
        items: { $ref: '#/$defs/property' }
      custom:
        type: array
        items: { $ref: '#/$defs/property' }
      tools:
        description: >-
          Plugins: a tool's name is "lowercase letters, digits, hyphens, unique in the project;
          `eidos` is reserved."
        type: object
        propertyNames: { $ref: '#/$defs/toolName' }
        additionalProperties:
          type: array
          items: { $ref: '#/$defs/property' }
  vocabulary:
    description: '`vocabulary`: "the project''s own terms. Starts empty."'
    type: array
    items: { $ref: '#/$defs/term' }
  index:
    description: >-
      `index`: "every collection's blueprints, rebuilt wholesale by whatever indexes the project."
      The index: each entry carries `id`, `title`, `summary` (null when absent), `path`, and
      `folder`, the folder's path from the collection, null at the top; an index written before
      5.12.0 says `group`. Generated, so only its shape is checked and anything more is allowed.
    type: object
    additionalProperties:
      type: array
      items:
        type: object
        properties:
          id: { type: [string, number] }
          title: { type: string }
          summary: { type: [string, 'null'] }
          path: { type: string }
          folder: { type: [string, 'null'] }
          group: { type: [string, 'null'] }

$defs:
  line:
    description: "A one-line description, as the sample's `description: one line`."
    type: string

  toolName:
    description: 'Plugins: "lowercase letters, digits, hyphens"; `eidos` is reserved.'
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    not: { const: eidos }
    x-says: is not a tool's name (lowercase letters, digits, hyphens; eidos is reserved)

  topLevelDoc:
    type: object
    required: [title, path, description]
    properties:
      title: { type: string, minLength: 1 }
      path:
        description: '`Framework.yaml`: "Every path is relative to `.eidos/`."'
        type: string
        minLength: 1
      description: { $ref: '#/$defs/line' }

  folder:
    description: >-
      Folders: an owner is `@eidos/collections`, a tool's `@<tool>/<kind>`, or none. "A check
      faults an owner that is malformed or an `@eidos/` kind the standard does not name, and never
      a tool's."
    type: object
    required: [name, description]
    properties:
      name: { type: string, minLength: 1 }
      title: { $ref: '#/$defs/title' }
      description: { $ref: '#/$defs/line' }
      owned_by:
        description: >-
          Folders: "An owner is `@<tool>/<kind>`, quoted in YAML: the tool's one identifier, then
          the tool's own name for what the folder holds, in the same characters. The standard owns
          `@eidos/collections` and defines nothing else under `@eidos/`."
        type: string
        pattern: '^@[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$'
        x-says: is not an owner (@<tool>/<kind>, lowercase letters, digits, hyphens)
        if: { pattern: '^@eidos/' }
        then:
          const: '@eidos/collections'
          x-says: names an @eidos/ kind the standard does not define; it defines @eidos/collections alone
      variants:
        description: >-
          `folders`: "A `@eidos/collections` folder may carry `variants`, its templates, and may
          declare none (`default: true` marks the collection's default; with none marked, it has
          none)". One default at most.
        type: array
        items: { $ref: '#/$defs/variant' }
        contains:
          type: object
          required: [default]
          properties: { default: { const: true } }
        minContains: 0
        maxContains: 1
        x-says: 'marks more than one variant `default: true`; a collection has one default at most'
      label:
        description: 'Folders: "its `label` is the collection''s own word for them (Areas, Domains, Parts)".'
        type: string
      folder_property:
        description: 'The sample: "the custom property carrying the folder''s path, if one does".'
        type: string
        minLength: 1
      loose_files:
        description: 'Folders: "`loose_files: false` keeps every blueprint in a folder that holds no folders"; on when absent.'
        type: boolean
      undeclared_folders:
        description: 'Folders: "`undeclared_folders: false` makes every folder be declared"; on when absent.'
        type: boolean
      folders:
        description: >-
          Folders: "A collection may declare its folders under its own `folders`, each entry the
          shape of a top-level folder's (`name`, `title`, `description`) and `default_variant`, with
          `folders` of its own beneath it."
        type: array
        items: { $ref: '#/$defs/collectionFolder' }
      grouping: { $ref: '#/$defs/grouping' }
    dependentSchemas:
      variants: { $ref: '#/$defs/collectionOnly' }
      grouping: { $ref: '#/$defs/groupingAlone' }
      label: { $ref: '#/$defs/collectionOnly' }
      folder_property: { $ref: '#/$defs/collectionOnly' }
      loose_files: { $ref: '#/$defs/collectionOnly' }
      undeclared_folders: { $ref: '#/$defs/collectionOnly' }
      folders: { $ref: '#/$defs/collectionOnly' }

  collectionOnly:
    description: 'Variants and folders are what a `@eidos/collections` folder carries.'
    required: [owned_by]
    properties:
      owned_by: { const: '@eidos/collections' }
    x-says: 'carries variants or folders, which only a folder owned by "@eidos/collections" has'

  groupingAlone:
    description: >-
      Folders: "A collection carries `grouping` or the new keys, never both." The older block is
      read as one level of folders with both settings off.
    allOf:
      - { $ref: '#/$defs/collectionOnly' }
      - not:
          anyOf:
            - { required: [label] }
            - { required: [folder_property] }
            - { required: [loose_files] }
            - { required: [undeclared_folders] }
            - { required: [folders] }
        x-says: 'carries the older `grouping` beside the folder keys; a collection carries one or the other'

  collectionFolder:
    description: >-
      Folders: "A collection's folders nest to any depth, and a folder holds blueprints, folders,
      or both." Each entry: `name`, `title`, `description`, `default_variant`, and `folders`.
    type: object
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        not: { pattern: '/' }
        x-says: 'is a path; a folder entry names one folder, and its `folders` hold the ones beneath it'
      title: { $ref: '#/$defs/title' }
      description: { $ref: '#/$defs/line' }
      default_variant:
        description: 'Folders: "A folder''s `default_variant` holds for everything beneath it until a deeper folder names its own; `default_variant: none` gives everything beneath it no default, the collection''s included."'
        type: string
      folders:
        type: array
        items: { $ref: '#/$defs/collectionFolder' }

  variant:
    type: object
    required: [name, template]
    properties:
      name:
        description: >-
          `folders`: "`none` is never a variant's name: a variant so named is a fault."
        type: string
        minLength: 1
        not: { pattern: '^[Nn][Oo][Nn][Ee]$' }
        x-says: is named none, which a blueprint writes in `variant` for no template
      title: { $ref: '#/$defs/title' }
      template:
        description: >-
          Templates: "The file is `<unit>.<variant>.md`, lowercase", under `templates/`, relative
          to `.eidos/`.
        type: string
        pattern: '^templates/[^/A-Z]+\.[^/A-Z]+\.md$'
        x-says: is not a template path (templates/<unit>.<variant>.md, lowercase)
      description: { $ref: '#/$defs/line' }
      default: { type: boolean }

  title:
    description: >-
      `folders`: "A folder, a collection's folder, and a variant may carry `title`, the name people read;
      absent, tools show `name`."
    type: string
    minLength: 1

  grouping:
    description: >-
      Folders: "A collection that still carries the older `grouping` block (`label`, `property`,
      `groups`, from before 5.12.0) is read as the same collection with `label`, `folder_property`,
      one level of `folders`, and both settings off".
    type: object
    required: [groups]
    properties:
      label: { type: string }
      property: { type: string }
      groups:
        type: array
        items:
          type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            title: { $ref: '#/$defs/title' }
            description: { $ref: '#/$defs/line' }
            default_variant:
              description: '`folders`: "A collection''s folder may name a default with `default_variant`, one of the collection''s variants or `none`."'
              type: string

  property:
    description: >-
      Properties: "Each entry: `name`, `type`, `applies_to`, `required`, `meaning`, and `options`
      when the value is one of a closed set." Rule 8: "Every property has a type, a meaning, and an
      owner." The standard properties table carries no `applies_to` and `required` may be absent, so the list is
      not the required set: name, type, and meaning are. `properties`: "any other key on an entry is a tool's", so other keys are allowed.
    type: object
    required: [name, type, meaning]
    properties:
      name: { type: string, minLength: 1 }
      type:
        description: >-
          Properties: "type is one of Text, List, Number, Checkbox, Date, Date & time, Object,
          matched in any case; any other is a fault."
        type: string
        x-says: is not one of the seven types (Text, List, Number, Checkbox, Date, Date & time, Object), matched in any case
        pattern: '^([Tt][Ee][Xx][Tt]|[Ll][Ii][Ss][Tt]|[Nn][Uu][Mm][Bb][Ee][Rr]|[Cc][Hh][Ee][Cc][Kk][Bb][Oo][Xx]|[Dd][Aa][Tt][Ee] & [Tt][Ii][Mm][Ee]|[Dd][Aa][Tt][Ee]|[Oo][Bb][Jj][Ee][Cc][Tt])$'
      applies_to:
        description: >-
          Properties: "applies_to is `all` or a list of collections, where `top_level` names the
          top-level docs."
        x-says: is neither all nor a list of collections (and top_level)
        oneOf:
          - const: all
          - type: array
            items: { type: string, minLength: 1 }
      required:
        description: 'Properties: "required (absent = `false`)".'
        type: boolean
      meaning: { type: string }
      options:
        description: >-
          Properties: "an ordered, non-empty list of allowed values, compared exactly ... An empty
          list is a fault, as is `options` on an Object."
        type: array
        minItems: 1
    if:
      required: [type]
      properties:
        type: { pattern: '^[Oo][Bb][Jj][Ee][Cc][Tt]$' }
    then:
      not: { required: [options] }
      x-says: carries options on an Object, which is a fault

  term:
    description: >-
      Vocabulary: "Each entry: `term`, `means`, `not` (the near-misses and why each differs), and
      `see` when a blueprint defines it in full."
    type: object
    required: [term, means]
    properties:
      term: { type: string, minLength: 1 }
      means: { type: string, minLength: 1 }
      not:
        type: array
        items: { type: string }
      see:
        description: 'Linking: a standard markdown path, relative to the file it sits in.'
        type: string
