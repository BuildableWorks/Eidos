# The framework document: the structure this root is written in, in one place. The version and naming
# convention, the top-level documents, the collections (with their variants and grouping), the Properties
# table, the Vocabulary, and, once blueprints exist, the generated index. The visible
# README.md at the root is the friendly door to it; keep it current with the `eidos` CLI.

# The Eidos version this framework targets; migrate reads and bumps it.
eidos_version: 5.2.1

# How files, folders, and links are named: kebab-case | TitleCase | Title Case. Absent = kebab-case. It
# governs the whole root and changing it later means renaming files, so it is settled at install.
naming: kebab-case

# The top-level documents: one entry per one-of-a-kind doc (an Outline of the whole
# book, a Style Sheet, a Bibliography), each a title, a path from this folder, and a one-line
# description. The framing docs live in the framing collection, not here. The `eidos` CLI refreshes
# this list.
top_level:
  - title: README
    path: ../README.md
    description: "the root's front door: what this book is, and pointers in."

# A collection is a top-level folder of repeated blueprints that share a body template. Frames holds
# the framing docs, what the root says first about the product, and Chapters the book's units. Add
# more with the `eidos` CLI. Each declares its variants (one default; each a template file named
# <unit>.<variant>.md under templates/, the unit being the word for one of its blueprints) and its grouping.
collections:
  # This framework's framing collection: the docs that set what every other blueprint is judged
  # against. Each frame follows the variant of its kind, and one left unwritten is a gap to surface,
  # not a failure.
  - name: Frames
    description: "The framing docs that set what every chapter is judged against: what the book argues, who it is for, how it sounds, and where it sits."
    variants:
      - { name: premise, template: templates/frame.premise.md, description: "what the book says, and why it has to exist", default: true }
      - { name: reader, template: templates/frame.reader.md, description: "who it is for, and what changes for them" }
      - { name: voice, template: templates/frame.voice.md, description: "person, tense, register, and the rules the prose keeps" }
      - { name: market, template: templates/frame.market.md, description: "shelf, comparables, and how it reaches readers" }
  - name: Chapters
    description: "The book's units, one per chapter, grouped by part."
    variants:
      - { name: full, template: templates/chapter.full.md, description: "the complete chapter template", default: true }
      - { name: sketch, template: templates/chapter.sketch.md, description: "Intent, Open Questions, What Happens, Out of Scope; grow into full" }
    grouping:
      label: Parts
      property: part
      # One entry per part, a name and a short description, as they accrue.
      groups: []

# The property contract: what a blueprint's frontmatter may carry, across every collection. One block
# per owner: the core properties Eidos's own machinery uses, the custom ones you (or the seed) add, and
# a tools.<tool> block for any tool that declares properties of its own (none ship with a seed). Every
# custom property declares which collections it applies to, `all` or a list, so a property never lands
# where it makes no sense (part is Chapters-only), and whether it is required: a required property is
# generated into every new blueprint and a missing one is noted; an optional one (the default) is there
# when it has a value. A type comes from the Obsidian set (Text, List, Number, Checkbox, Date, Date &
# time), so frontmatter renders natively in a vault. A property whose value is one of a closed set
# declares the set as `options`, in the order the values run; a value off the list is surfaced, never
# refused. The `eidos` CLI edits the custom block.
properties:
  # Present on every blueprint. Managed by the standard (Eidos 5.2.1); migrate rewrites this block on a
  # version change, so don't hand-edit it. variant absent = the collection's default; a missing summary
  # is flagged by the index.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form: a slug, a number, a GUID. Assigned once, never changed. References point at it." }
    - { name: title, type: Text, required: true, meaning: "Human-readable name." }
    - { name: summary, type: Text, meaning: "One plain line: what this blueprint is, in a sentence, distilled from Intent. Source for the collection's index listing; absent, the index flags it." }
    - { name: variant, type: Text, meaning: "Which body variant this blueprint follows, from its collection's declared variants. Absent = the collection's default." }
  # Yours to shape with the `eidos` CLI. The seed ships a few useful defaults; keep, scope, or drop any of
  # them, Eidos doesn't depend on them. Only the grouping is required; a missing required property is
  # a soft gap a check notes, never refuses, and an absent optional one is nothing.
  custom:
    - { name: status, type: Text, applies_to: all, options: [Draft, Outlined, Drafted, Revised, Final, Cut], meaning: "Lifecycle stage." }
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The day the blueprint was first written. Set once." }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The day the blueprint was last changed." }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: part, type: Text, required: true, applies_to: [Chapters], meaning: "The grouping, matching the blueprint's sub-folder under its collection in the naming convention. An unknown value warns, never fails." }
    - { name: depends_on, type: List, applies_to: [Chapters], meaning: "Chapters a reader must have read first, each a markdown link. A reading dependency." }

# The term contract: the words this root uses on purpose, so a distinction made once is not lost later.
# One entry per term: what it means, and what it is not (the near-misses, each with why it is a different
# thing); `see` points at the blueprint that defines the term in full. Eidos declares none of these; the
# list starts empty and grows an entry when a word begins to carry a distinction worth keeping.
# The `eidos` CLI edits it and presses for all three of term, means, and not.
vocabulary: []

