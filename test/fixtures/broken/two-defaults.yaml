# A collection that marks two variants as its default.
eidos_version: 5.7.0
folders:
  - name: specs
    owned_by: "@eidos/collections"
    description: the product's specs
    variants:
      - { name: full, template: templates/spec.full.md, default: true }
      - { name: micro, template: templates/spec.micro.md, default: true }
